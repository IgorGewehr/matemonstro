# Alvo desktop (Tauri): em todo PR, builda web E desktop (mata deriva
# dual-target); em tag v*, gera instaladores (.dmg universal mac + NSIS win)
# anexados a um draft de GitHub Release.
#
# Assinatura (quando houver conta Apple Developer): adicionar os secrets
# APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
# APPLE_API_ISSUER, APPLE_API_KEY, APPLE_API_KEY_ID ao job de release —
# o tauri-action assina e notariza sozinho.
name: desktop

on:
  pull_request:
  push:
    tags: ["v*"]

jobs:
  dual-build-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run build:desktop

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Matemonstro ${{ github.ref_name }}"
          releaseBody: |
            Instaladores do Matemonstro desktop (offline, notas em vault .md local).

            **macOS**: o app ainda não é assinado — após instalar, se o sistema bloquear,
            vá em Ajustes → Privacidade e Segurança → "Abrir Mesmo Assim".
            **Windows**: no aviso do SmartScreen, clique "Mais informações" → "Executar assim mesmo".
          releaseDraft: true
          args: ${{ matrix.args }}
