[package]
name = "matemonstro"
version = "0.1.0"
description = "Matemonstro — guia de estudos de matemática pura, da base ao mestrado"
authors = ["Igor Gewehr"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "matemonstro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[profile.release]
codegen-units = 1
lto = true
strip = true
